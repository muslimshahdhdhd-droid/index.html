<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB3D VIP Hub & AI Generator</title>
    <style>
        :root { --neon: #00ffcc; --bg: #0a0a0a; --glass: rgba(0, 255, 204, 0.1); }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 20px; }
        h1, h2 { color: var(--neon); text-shadow: 0 0 15px var(--neon); text-transform: uppercase; letter-spacing: 2px; }
        .search-box, .ai-input { width: 90%; padding: 15px; border-radius: 30px; border: 2px solid var(--neon); background: #1a1a1a; color: white; margin-bottom: 20px; outline: none; font-size: 1rem; box-shadow: 0 0 10px var(--glass); }
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; max-width: 900px; margin: auto; }
        .card { background: #1a1a1a; padding: 15px; border-radius: 12px; border-bottom: 3px solid var(--neon); transition: 0.3s; }
        .card:hover { transform: translateY(-5px); background: #222; }
        .code { display: block; font-size: 1.5rem; font-weight: bold; color: var(--neon); }
        .name { font-size: 0.85rem; color: #ccc; text-transform: uppercase; }
        
        /* AI Section Design */
        .ai-section { margin-top: 50px; padding: 25px; background: var(--glass); border-radius: 25px; border: 1px solid var(--neon); box-shadow: 0 0 20px rgba(0,255,204,0.1); }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 500px; margin: auto; }
        button { padding: 12px; border-radius: 15px; border: none; background: var(--neon); color: black; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
        button:active { transform: scale(0.95); }
        #aiResult { margin-top: 25px; padding: 20px; background: #000; border-radius: 15px; color: #fff; text-align: left; display: none; border-left: 5px solid var(--neon); line-height: 1.6; }
    </style>
</head>
<body>

    <h2>IB3D Cheat Codes 🏎️</h2>
    <input type="text" id="searchInput" class="search-box" placeholder="Search any cheat (Thar, Bike, Tank)..." onkeyup="searchCheat()">

    <div class="container" id="cheatContainer">
        <div class="card"><span class="code">0000</span><span class="name">Dirt Bike</span></div>
        <div class="card"><span class="code">9090</span><span class="name">Thar</span></div>
        <div class="card"><span class="code">4040</span><span class="name">Tank</span></div>
        <div class="card"><span class="code">3333</span><span class="name">Lamborghini</span></div>
        <div class="card"><span class="code">8000</span><span class="name">Helicopter</span></div>
        <div class="card"><span class="code">600</span><span class="name">Dog</span></div>
        <div class="card"><span class="code">1000</span><span class="name">Fortuner</span></div>
        <div class="card"><span class="code">002</span><span class="name">Tattoo</span></div>
    </div>

    <div class="ai-section">
        <h2>AI Content Studio 🤖</h2>
        <input type="text" id="aiPrompt" class="ai-input" placeholder="Yahan topic likhen (e.g. Scary Bike Stunt)...">
        
        <div class="btn-grid">
            <button onclick="generateAI(1)">1. Video Script</button>
            <button onclick="generateAI(2)">2. Thumbnail Idea</button>
            <button onclick="generateAI(3)">3. Video Prompt</button>
            <button onclick="generateAI(4)" style="background: #ff00ff; color: white;">4. AI Song Lyrics</button>
        </div>

        <div id="aiResult"></div>
    </div>

    <script>
        function searchCheat() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('card');
            for (let i = 0; i < cards.length; i++) {
                let text = cards[i].innerText.toLowerCase();
                cards[i].style.display = text.includes(input) ? "" : "none";
            }
        }

        function generateAI(option) {
            let topic = document.getElementById('aiPrompt').value;
            let resultDiv = document.getElementById('aiResult');
            if(!topic) { alert("Pehle topic toh likhen Shah bhai!"); return; }

            resultDiv.style.display = "block";
            if(option === 1) {
                resultDiv.innerHTML = "<b>📜 Viral Script:</b><br>Salam doston! Swagat hai ek aur crazy video mein. Aaj humne " + topic + " try kiya hai aur kasam se end mein jo hua aap yaqeen nahi karenge! Subscribe karna mat bhoolna.";
            } else if(option === 2) {
                resultDiv.innerHTML = "<b>🖼️ Thumbnail Design:</b><br>Background mein " + topic + " ki photo lagayen, upar bare fonts mein '100% IMPOSSIBLE' likhen aur apne face ka shocked expression daalein.";
            } else if(option === 3) {
                resultDiv.innerHTML = "<b>🎬 AI Video Prompt:</b><br>High-octane action shot of " + topic + " in Indian city streets, sunset lighting, realistic textures, 8k resolution, cinematic drone view.";
            } else if(option === 4) {
                resultDiv.innerHTML = "<b>🎵 AI Song Lyrics (Phonk Style):</b><br>(Verse 1)<br>Raftaar meri tez, " + topic + " mera jadu<br>Cheat codes on lock, dunya mere kabu<br>0000 dabhaya, mitti mein aag lagayi<br>Shah bhai ki public ne dhoom machayi!<br>(Chorus)<br>Burnin' the street, no retreat, feel the heat!";
            }
        }
    </script>
</body>
</html>
